name: CI

# Runs the same gates as `npm run verify`, as separate steps so a failure names the gate that broke.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the pinned development version (.nvmrc); 24 guards against the next LTS.
        node: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always() && matrix.node == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  browser:
    # Real Chromium: pointer capture, canvas rasterisation and real downloads cannot be verified in
    # jsdom, so they get their own job with its own reported result (docs/ROADMAP.md).
    #
    # Deliberately *not* gated on `verify`: a failing unit test must not be able to hide whether the
    # product works in a browser. The job builds the application itself, so a broken build still
    # fails here, and an independent result is the whole point of having a second signal (ADR-0018).
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read-only everywhere else. Writing is needed for exactly one thing: publishing the measured
    # performance numbers as a comment on the pull request, because the benchmark's numbers are the
    # evidence and the run log itself is not always reachable.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The browser job runs once, on the pinned development version.
          node-version: 22.x
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Browser tests
        run: npm run test:e2e

      - name: Publish the performance report
        # Best effort on purpose: the report is evidence for a human to read, and a benchmark result
        # must never be able to break the build. The same numbers also appear in the failure message
        # of the performance spec, which reaches the check-run annotations.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f test-results/perf-report.md ]; then
            echo "no performance report was written"
            exit 0
          fi
          BODY=$(printf '%s\n\n%s' '<!-- eulerforge-perf-report -->' "$(cat test-results/perf-report.md)")
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("eulerforge-perf-report")) | .id' | tail -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -f body="$BODY" > /dev/null
            echo "updated performance comment $EXISTING"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" > /dev/null
            echo "created the performance comment"
          fi

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
