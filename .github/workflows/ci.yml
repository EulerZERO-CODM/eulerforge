name: CI

# Runs the same gates as `npm run verify`, as separate steps so a failure names the gate that broke.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the pinned development version (.nvmrc); 24 guards against the next LTS.
        node: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always() && matrix.node == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  browser:
    # Real Chromium: pointer capture, canvas rasterisation and real downloads cannot be verified in
    # jsdom, so they get their own job with its own reported result (docs/ROADMAP.md).
    #
    # Deliberately *not* gated on `verify`: a failing unit test must not be able to hide whether the
    # product works in a browser. The job builds the application itself, so a broken build still
    # fails here, and an independent result is the whole point of having a second signal (ADR-0018).
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The browser job runs once, on the pinned development version.
          node-version: 22.x
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
